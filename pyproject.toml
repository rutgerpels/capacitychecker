[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacitychecker"
version = "0.1.0"
description = "CLI-first Azure multi-region capacity checker."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "capacitychecker_v2 contributors" }
]

[project.scripts]
capacitychecker = "capacitychecker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capacitychecker*"]
