[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacitychecker"
dynamic = ["version"]
description = "CLI-first Azure multi-region capacity checker."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "capacitychecker_v2 contributors" }
]
keywords = ["azure", "capacity", "virtual-machines", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
capacitychecker = "capacitychecker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capacitychecker*"]

[tool.setuptools.dynamic]
version = { attr = "capacitychecker.__version__" }
