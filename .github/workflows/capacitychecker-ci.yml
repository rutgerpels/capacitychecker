name: Capacity Checker CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Verify package version wiring
        run: |
          python - <<'PY'
          import importlib.metadata
          import capacitychecker

          assert importlib.metadata.version("capacitychecker") == capacitychecker.__version__
          PY

      - name: Run unit tests
        run: python -m unittest discover -q

      - name: Smoke-test console script
        run: |
          capacitychecker --version
          capacitychecker check --help
